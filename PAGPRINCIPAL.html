<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Hotel & Resort</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
            url('https://images.unsplash.com/photo-1566073771259-6a8506099945?q=80&w=1600&auto=format&fit=crop') no-repeat center center/cover;
            color: white;
            text-align: center;
        }

        .container{
            background: rgba(255,255,255,0.1);
            padding: 50px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            max-width: 700px;
        }

        h1{
            font-size: 55px;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        h2{
            font-size: 28px;
            margin-bottom: 20px;
            color: #ffd700;
        }

        p{
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn{
            display: inline-block;
            padding: 15px 35px;
            background: #ffd700;
            color: #000;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover{
            background: white;
            transform: scale(1.05);
        }

        footer{
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #ddd;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Aura Hotel & Resort</h1>

        <h2>✨ Muy Pronto ✨</h2>

        <p>
            La nueva página oficial de Aura Hotel & Resort estará disponible próximamente.
            Estamos preparando una experiencia increíble llena de lujo, comodidad y elegancia para ti.
        </p>

        <a href="#" class="btn">Próximamente</a>
    </div>

    <footer>
        © 2026 Aura Hotel & Resort | Managua, Nicaragua
    </footer>

</body>
</html>
